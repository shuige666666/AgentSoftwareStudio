# ---- 阿里百炼平台示例 ----
studio:
  ai:
    # 可选：deepseek-direct、alibaba-bailian、generic-openai。只有直连 DeepSeek 时启用专用缓存指标。
    provider: alibaba-bailian

spring:
  ai:
    openai:
      # API Key
      api-key: ${ALIBABA_API_KEY}
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      chat:
        options:
          model: qwen3.7-flash-2026-07-15
          temperature: 0.5

