# ---- 阿里百炼平台示例 ----
spring:
  ai:
    openai:
      # API Key
      api-key: ${ALIBABA_API_KEY}
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      chat:
        options:
          model: qwen3.7-flash-2026-07-15
          temperature: 0.5

