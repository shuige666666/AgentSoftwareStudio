server:
  port: 8080

studio:
  ai:
    # 可选：deepseek-direct、alibaba-bailian、generic-openai；前两者读取各自的缓存命中字段。
    provider: alibaba-bailian
  agent-runtime:
    # 连续开发会话的轮次和工具上限；正式验证失败由同一会话继续修复。
    development:
      max-model-turns: 72
      max-tool-calls: 128
    implement:
      max-model-turns: 24
      max-tool-calls: 72
    test:
      max-model-turns: 12
      max-tool-calls: 36
    frontend-integration:
      max-model-turns: 8
      max-tool-calls: 24
    repair-implementation:
      max-model-turns: 16
      max-tool-calls: 48
    repair-test:
      max-model-turns: 16
      max-tool-calls: 48
    repair-contract:
      max-model-turns: 16
      max-tool-calls: 48
    stagnation:
      # 同一写入版本反复执行相同工具，或反复得到相同证据时提前交给外层验证。
      max-identical-tool-calls: 3
      max-calls-without-new-evidence: 8
      max-repeated-verification-failures-after-edit: 2
    context:
      # 估算上下文占用达到窗口的 70% 时，保留原始目标与最近三轮完整工具交互。
      max-context-tokens: 64000
      compact-at-percent: 70
      retained-model-turns: 3
      max-latest-tool-result-chars: 6000
    audit:
      # 每次工具指令和真实结果按 JSONL 立即落盘，日志目录与候选项目分离。
      enabled: true
      root-directory: studio-run-logs
      max-prompt-chars: 200000
      max-argument-chars: 200000
      max-result-chars: 32000
