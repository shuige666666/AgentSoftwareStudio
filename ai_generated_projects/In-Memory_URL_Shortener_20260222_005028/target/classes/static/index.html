<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>In-Memory URL Shortener</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white text-center">
                        <h2>URL Shortener</h2>
                    </div>
                    <div class="card-body">
                        <form id="urlForm" class="mb-4">
                            <div class="mb-3">
                                <label for="longUrl" class="form-label">Enter Long URL:</label>
                                <input type="text" class="form-control" id="longUrl" name="longUrl" placeholder="https://example.com/very/long/url" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Shorten URL</button>
                        </form>
                        
                        <div id="resultSection" class="alert alert-success d-none">
                            <h5>Your Shortened URL:</h5>
                            <div class="input-group">
                                <input type="text" class="form-control" id="shortUrl" readonly>
                                <button class="btn btn-outline-secondary" type="button" id="copyBtn">Copy</button>
                            </div>
                        </div>
                        
                        <div id="errorSection" class="alert alert-danger d-none">
                            <span id="errorMessage"></span>
                        </div>
                        
                        <div class="mt-4">
                            <h5>Statistics</h5>
                            <p>Total Links Created: <span id="totalLinks">0</span></p>
                            <p>Total Redirects: <span id="totalRedirects">0</span></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:inline="javascript">
        document.getElementById('urlForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const longUrl = document.getElementById('longUrl').value;
            
            fetch('/api/shorten', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ url: longUrl })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    document.getElementById('shortUrl').value = window.location.origin + '/' + data.shortCode;
                    document.getElementById('resultSection').classList.remove('d-none');
                    document.getElementById('errorSection').classList.add('d-none');
                    document.getElementById('longUrl').value = '';
                    
                    // Update statistics
                    document.getElementById('totalLinks').textContent = data.totalLinks;
                    document.getElementById('totalRedirects').textContent = data.totalRedirects;
                } else {
                    document.getElementById('errorMessage').textContent = data.message;
                    document.getElementById('errorSection').classList.remove('d-none');
                    document.getElementById('resultSection').classList.add('d-none');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('errorMessage').textContent = 'An error occurred while shortening the URL.';
                document.getElementById('errorSection').classList.remove('d-none');
                document.getElementById('resultSection').classList.add('d-none');
            });
        });
        
        document.getElementById('copyBtn').addEventListener('click', function() {
            const shortUrlInput = document.getElementById('shortUrl');
            shortUrlInput.select();
            document.execCommand('copy');
            
            // Show feedback
            const originalText = this.textContent;
            this.textContent = 'Copied!';
            setTimeout(() => {
                this.textContent = originalText;
            }, 2000);
        });
        
        // Load initial statistics
        fetch('/api/stats')
        .then(response => response.json())
        .then(data => {
            document.getElementById('totalLinks').textContent = data.totalLinks;
            document.getElementById('totalRedirects').textContent = data.totalRedirects;
        });
    </script>
</body>
</html>
