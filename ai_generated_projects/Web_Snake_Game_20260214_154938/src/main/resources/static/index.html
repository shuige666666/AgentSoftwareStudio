<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>贪吃蛇游戏</title>
    <style>
        :root{
            --bg:#0f1724; /* deep navy */
            --panel: rgba(255,255,255,0.06);
            --glass: rgba(255,255,255,0.06);
            --accent: linear-gradient(90deg,#7C3AED,#06B6D4);
            --muted: rgba(255,255,255,0.65);
            --positive: #10B981;
            --danger: #EF4444;
            --card-shadow: 0 8px 30px rgba(2,6,23,0.6);
        }
        html,body{height:100%;margin:0;font-family:Inter,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:radial-gradient(1200px 600px at 10% 10%, rgba(99,102,241,0.08), transparent), radial-gradient(1000px 500px at 90% 90%, rgba(6,182,212,0.06), transparent), var(--bg);color:#fff}
        .app-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
        .game-container{
            width:100%;max-width:980px;background:linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.02));border-radius:16px;padding:20px;box-shadow:var(--card-shadow);backdrop-filter: blur(6px);-webkit-backdrop-filter: blur(6px);
            display:grid;grid-template-columns: 1fr 340px;gap:20px;align-items:start
        }
        @media (max-width:880px){
            .game-container{grid-template-columns:1fr;}
            .side{order:2}
            .main{order:1}
        }
        .header{grid-column:1 / -1;display:flex;align-items:center;justify-content:space-between}
        h1{font-size:20px;margin:0;font-weight:600;letter-spacing:0.2px}
        .subtle{color:var(--muted);font-size:13px}

        .main{display:flex;flex-direction:column;align-items:center;gap:12px}
        .canvas-wrap{background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));padding:14px;border-radius:12px;border:1px solid rgba(255,255,255,0.04)}
        canvas{display:block;background:#0b1220;border-radius:8px;border:1px solid rgba(255,255,255,0.02);outline:none}

        .side{padding:12px}
        .score-board{display:flex;flex-direction:column;gap:12px}
        .score-row{display:flex;justify-content:space-between;align-items:center;padding:10px;border-radius:10px;background:linear-gradient(90deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));border:1px solid rgba(255,255,255,0.03)}
        .score{font-weight:700;font-size:18px}
        .high{font-size:13px;color:var(--muted)}

        .controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
        .btn{padding:10px 14px;border-radius:10px;border:none;background:var(--accent);color:#fff;font-weight:600;cursor:pointer;box-shadow:0 6px 18px rgba(124,58,237,0.18);}
        .btn.ghost{background:transparent;border:1px solid rgba(255,255,255,0.06);box-shadow:none}
        .btn:active{transform:translateY(1px)}

        .status{margin-top:10px;color:var(--muted);font-size:13px}

        /* On-screen arrow controls for touch devices */
        .touch-controls{display:flex;flex-direction:column;gap:6px;align-items:center;margin-top:14px}
        .dpad{width:180px;height:180px;border-radius:14px;background:linear-gradient(180deg, rgba(255,255,255,0.01), rgba(255,255,255,0.02));display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:8px;padding:10px}
        .dpad button{background:rgba(255,255,255,0.03);border:none;color:#fff;border-radius:8px;font-size:18px;display:flex;align-items:center;justify-content:center}
        .dpad button.active{background:linear-gradient(90deg,#06B6D4,#7C3AED)}

        /* Modal & toast */
        .modal-backdrop{position:fixed;inset:0;background:linear-gradient(180deg, rgba(2,6,23,0.5), rgba(2,6,23,0.7));display:flex;align-items:center;justify-content:center;z-index:60;visibility:hidden;opacity:0;transition:all .22s ease}
        .modal-backdrop.show{visibility:visible;opacity:1}
        .modal{background:linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.02));padding:18px;border-radius:12px;min-width:320px;border:1px solid rgba(255,255,255,0.04);text-align:center}
        .modal h2{margin:0 0 8px 0}
        .toast{position:fixed;right:20px;bottom:20px;background:rgba(0,0,0,0.6);color:#fff;padding:10px 14px;border-radius:10px;z-index:70;backdrop-filter:blur(6px)}

        /* small helper */
        .muted{color:var(--muted)}
    </style>
</head>
<body>
<div class="app-wrap">
    <div class="game-container">
        <div class="header">
            <div>
                <h1>贪吃蛇 - 高级版</h1>
                <div class="subtle">使用方向键 / WASD 控制，支持触摸操作与空格开始</div>
            </div>
            <div style="display:flex;gap:12px;align-items:center">
                <div class="muted">作者</div>
                <div class="subtle">本地演示</div>
            </div>
        </div>

        <div class="main">
            <div class="canvas-wrap">
                <!-- Make canvas focusable so keyboard events can be captured reliably -->
                <canvas id="game-canvas" width="480" height="480" tabindex="0" aria-label="贪吃蛇游戏画布"></canvas>
            </div>

            <div class="status" id="status-text">准备就绪 — 点击“开始游戏”或按空格开始</div>
            <div style="display:flex;gap:8px;align-items:center;width:100%;justify-content:center">
                <button class="btn" onclick="startGame()" id="start-btn">开始游戏</button>
                <button class="btn ghost" onclick="pauseGame()" id="pause-btn">暂停/继续</button>
                <button class="btn ghost" onclick="resetGame()" id="reset-btn">重置</button>
            </div>

            <div class="touch-controls" id="touch-area" aria-hidden="true">
                <div class="dpad" id="dpad">
                    <button data-dir="" aria-hidden="true"></button>
                    <button data-dir="up" id="btn-up">↑</button>
                    <button data-dir="" aria-hidden="true"></button>

                    <button data-dir="left" id="btn-left">←</button>
                    <button data-dir="" aria-hidden="true">•</button>
                    <button data-dir="right" id="btn-right">→</button>

                    <button data-dir="" aria-hidden="true"></button>
                    <button data-dir="down" id="btn-down">↓</button>
                    <button data-dir="" aria-hidden="true"></button>
                </div>
            </div>
        </div>

        <div class="side">
            <div class="score-board">
                <div class="score-row">
                    <div>
                        <div class="muted">当前得分</div>
                        <div class="score" id="current-score">0</div>
                    </div>
                    <div style="text-align:right">
                        <div class="muted">最高分</div>
                        <div class="high" id="high-score">0</div>
                    </div>
                </div>

                <div class="score-row">
                    <div>
                        <div class="muted">游戏速度</div>
                        <div id="speed-indicator">正常</div>
                    </div>
                    <div style="text-align:right">
                        <div class="muted">状态</div>
                        <div id="play-state">就绪</div>
                    </div>
                </div>

                <div class="score-row">
                    <div style="width:100%">
                        <div class="muted">提示</div>
                        <div class="muted" id="ui-tips">方向键/WASD 控制；点击画布以聚焦；触摸设备使用屏幕按钮或滑动</div>
                        <div id="input-hint" class="muted" style="margin-top:6px;font-size:13px">最后输入：无</div>
                    </div>
                </div>

                <div style="margin-top:12px">
                    <div class="muted" style="font-size:13px;margin-bottom:6px">快捷操作</div>
                    <div style="display:flex;gap:8px">
                        <button class="btn ghost" onclick="setSpeed(200)">慢</button>
                        <button class="btn" onclick="setSpeed(120)">正常</button>
                        <button class="btn ghost" onclick="setSpeed(80)">快</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Game over modal -->
        <div id="modal" class="modal-backdrop" role="dialog" aria-modal="true">
            <div class="modal" id="modal-content">
                <h2 id="modal-title">游戏结束</h2>
                <p id="modal-body">你的分数：<strong id="modal-score">0</strong></p>
                <div style="display:flex;gap:8px;justify-content:center;margin-top:12px">
                    <button class="btn" onclick="startGame()">重新开始</button>
                    <button class="btn ghost" onclick="closeModal()">关闭</button>
                </div>
            </div>
        </div>

        <div id="toast" class="toast" style="display:none">提示</div>

    </div>
</div>

<script>
    (function(){
        // 获取画布和上下文
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');

        // UI elements
        const statusText = document.getElementById('status-text');
        const playState = document.getElementById('play-state');
        const startBtn = document.getElementById('start-btn');
        const pauseBtn = document.getElementById('pause-btn');
        const resetBtn = document.getElementById('reset-btn');
        const toastEl = document.getElementById('toast');
        const modal = document.getElementById('modal');
        const modalScore = document.getElementById('modal-score');
        const modalTitle = document.getElementById('modal-title');
        const highScoreEl = document.getElementById('high-score');
        const inputHint = document.getElementById('input-hint');

        // 游戏状态
        let gameRunning = false;
        let gamePaused = false;
        let score = 0;
        let highScore = parseInt(localStorage.getItem('snakeHighScore')||'0',10) || 0;
        highScoreEl.textContent = highScore;

        // 蛇的初始位置和大小
        const gridSize = 20;
        const gridWidth = Math.floor(canvas.width / gridSize);
        const gridHeight = Math.floor(canvas.height / gridSize);

        let snake = [
            {x: 10, y: 10},
            {x: 9, y: 10},
            {x: 8, y: 10}
        ];

        let food = generateFood();
        let direction = 'right';
        let nextDirection = 'right';

        // speed control (ms per tick)
        let speed = 120; // default
        let loopHandle = null;

        function setSpeed(ms){
            speed = ms;
            if(speed<=90) document.getElementById('speed-indicator').textContent = '快速';
            else if(speed<=140) document.getElementById('speed-indicator').textContent = '正常';
            else document.getElementById('speed-indicator').textContent = '慢速';
            showToast('速度已设置');
        }

        // 生成食物位置
        function generateFood() {
            let newFood;
            do {
                newFood = {
                    x: Math.floor(Math.random() * gridWidth),
                    y: Math.floor(Math.random() * gridHeight)
                };
                // 确保食物不在蛇身上
            } while (snake.some(segment => segment.x === newFood.x && segment.y === newFood.y));

            return newFood;
        }

        // 绘制游戏元素
        function draw() {
            // 清空画布
            ctx.clearRect(0,0,canvas.width,canvas.height);

            // 背景格子（subtle）
            ctx.fillStyle = '#071226';
            ctx.fillRect(0,0,canvas.width,canvas.height);

            // 绘制食物
            ctx.fillStyle = '#FF6B4A';
            ctx.fillRect(
                food.x * gridSize + 2,
                food.y * gridSize + 2,
                gridSize - 4,
                gridSize - 4
            );

            // 绘制蛇
            snake.forEach((segment, index) => {
                const x = segment.x * gridSize;
                const y = segment.y * gridSize;
                if (index === 0) {
                    // 蛇头 - gradient
                    const grad = ctx.createLinearGradient(x,y,x+gridSize,y+gridSize);
                    grad.addColorStop(0,'#7C3AED');
                    grad.addColorStop(1,'#06B6D4');
                    ctx.fillStyle = grad;
                } else {
                    ctx.fillStyle = '#22c55e';
                }
                roundRect(ctx, x+1, y+1, gridSize-2, gridSize-2, 4, true, false);
            });
        }

        // helper: rounded rect
        function roundRect(ctx,x,y,w,h,r,fill,stroke){
            if(typeof r==='undefined') r=5;
            ctx.beginPath();
            ctx.moveTo(x+r,y);
            ctx.arcTo(x+w,y,x+w,y+h,r);
            ctx.arcTo(x+w,y+h,x,y+h,r);
            ctx.arcTo(x,y+h,x,y,r);
            ctx.arcTo(x,y,x+w,y,r);
            ctx.closePath();
            if(fill) ctx.fill();
            if(stroke) ctx.stroke();
        }

        // 更新游戏状态
        function update() {
            if (gamePaused) return;

            // 更新方向
            direction = nextDirection;

            // 计算新的头部位置
            const head = {...snake[0]};
            switch(direction) {
                case 'up': head.y -= 1; break;
                case 'down': head.y += 1; break;
                case 'left': head.x -= 1; break;
                case 'right': head.x += 1; break;
            }

            // 检查碰撞边界
            if (
                head.x < 0 || 
                head.x >= gridWidth || 
                head.y < 0 || 
                head.y >= gridHeight
            ) {
                gameOver('撞墙');
                return;
            }

            // 检查碰撞自己
            if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
                gameOver('撞到自己');
                return;
            }

            // 添加新头部
            snake.unshift(head);

            // 检查是否吃到食物
            if (head.x === food.x && head.y === food.y) {
                // 增加分数
                score += 10;
                document.getElementById('current-score').textContent = score;

                // 生成新食物
                food = generateFood();
                showToast('+10');
            } else {
                // 移除尾部
                snake.pop();
            }
        }

        // 游戏循环
        function gameLoop() {
            if (gameRunning) {
                update();
                draw();
                loopHandle = setTimeout(gameLoop, speed);
            }
        }

        // 开始游戏
        function startGame() {
            if (!gameRunning) {
                // 如果是新游戏（来自 modal 关闭或初始），不要完全重置当想继续时
                resetGame(true);
                gameRunning = true;
                gamePaused = false;
                playState.textContent = '进行中';
                statusText.textContent = '游戏进行中 — 使用方向键 / WASD 控制';
                canvas.focus();
                closeModal();
                if(loopHandle) clearTimeout(loopHandle);
                gameLoop();
            } else if (gamePaused) {
                gamePaused = false;
                playState.textContent = '进行中';
                statusText.textContent = '已恢复';
                canvas.focus();
                gameLoop();
            }
        }

        // 暂停/继续游戏
        function pauseGame() {
            if (gameRunning) {
                gamePaused = !gamePaused;
                playState.textContent = gamePaused? '已暂停' : '进行中';
                statusText.textContent = gamePaused? '游戏已暂停' : '继续游戏';
                if (!gamePaused) {
                    canvas.focus();
                    gameLoop();
                } else {
                    if(loopHandle) clearTimeout(loopHandle);
                }
            }
        }

        // 重置游戏
        function resetGame(skipScoreReset){
            snake = [
                {x: 10, y: 10},
                {x: 9, y: 10},
                {x: 8, y: 10}
            ];
            direction = 'right';
            nextDirection = 'right';
            if(!skipScoreReset){
                score = 0;
                document.getElementById('current-score').textContent = score;
            }
            food = generateFood();
            draw();
            canvas.focus();
            playState.textContent = '就绪';
            statusText.textContent = '准备就绪 — 点击“开始游戏”或按空格开始';
            if(loopHandle) clearTimeout(loopHandle);
        }

        // 游戏结束
        function gameOver(reason){
            gameRunning = false;
            if(loopHandle) clearTimeout(loopHandle);
            // 更新最高分
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('snakeHighScore', highScore);
                highScoreEl.textContent = highScore;
                modalTitle.textContent = '恭喜！新纪录';
            } else {
                modalTitle.textContent = '游戏结束';
            }
            modalScore.textContent = score;
            document.getElementById('modal-body').textContent = `你的分数：${score}（原因：${reason}）`;
            showModal();
            playState.textContent = '已结束';
            statusText.textContent = `游戏结束 — 分数：${score}`;
        }

        // Modal handlers
        function showModal(){
            modal.classList.add('show');
        }
        function closeModal(){
            modal.classList.remove('show');
        }

        // Toast
        let toastTimer = null;
        function showToast(text, duration=900){
            toastEl.textContent = text;
            toastEl.style.display = 'block';
            if(toastTimer) clearTimeout(toastTimer);
            toastTimer = setTimeout(()=>{toastEl.style.display='none';}, duration);
        }

        // Keyboard and input handling
        window.addEventListener('keydown', handleKeydown, {passive:false});
        document.addEventListener('keydown', handleKeydown, {passive:false});

        function handleKeydown(e){
            const key = e.key;
            // prevent scrolling for arrows/space
            if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' ','Spacebar','Space'].includes(key)){
                e.preventDefault();
            }

            switch(key){
                case 'ArrowUp': case 'w': case 'W':
                    if (direction !== 'down') nextDirection = 'up';
                    if(inputHint) inputHint.textContent = '最后输入：↑ (UP)';
                    break;
                case 'ArrowDown': case 's': case 'S':
                    if (direction !== 'up') nextDirection = 'down';
                    if(inputHint) inputHint.textContent = '最后输入：↓ (DOWN)';
                    break;
                case 'ArrowLeft': case 'a': case 'A':
                    if (direction !== 'right') nextDirection = 'left';
                    if(inputHint) inputHint.textContent = '最后输入：← (LEFT)';
                    break;
                case 'ArrowRight': case 'd': case 'D':
                    if (direction !== 'left') nextDirection = 'right';
                    if(inputHint) inputHint.textContent = '最后输入：→ (RIGHT)';
                    break;
                case ' ': case 'Spacebar': case 'Space':
                    if (!gameRunning){ startGame(); }
                    else if(gamePaused){ pauseGame(); }
                    if(inputHint) inputHint.textContent = '最后输入：空格 (START/PAUSE)';
                    break;
                case 'p': case 'P':
                    // p to pause
                    pauseGame();
                    if(inputHint) inputHint.textContent = '最后输入：P (PAUSE)';
                    break;
            }
        }

        // On-screen touch buttons
        ['up','down','left','right'].forEach(dir=>{
            const btn = document.querySelector(`[data-dir="${dir}"]`);
            if(btn){
                btn.addEventListener('touchstart', (ev)=>{ ev.preventDefault(); setDirectionFromUI(dir); }, {passive:false});
                btn.addEventListener('mousedown', ()=> setDirectionFromUI(dir));
            }
        });

        function setDirectionFromUI(dir){
            if(dir === 'up' && direction !== 'down') nextDirection = 'up';
            if(dir === 'down' && direction !== 'up') nextDirection = 'down';
            if(dir === 'left' && direction !== 'right') nextDirection = 'left';
            if(dir === 'right' && direction !== 'left') nextDirection = 'right';
            // visual feedback
            document.querySelectorAll('.dpad button').forEach(b=>b.classList.remove('active'));
            const active = document.querySelector(`[data-dir="${dir}"]`);
            if(active) active.classList.add('active');
            setTimeout(()=>{ if(active) active.classList.remove('active'); }, 120);
            // update input hint UI
            if(inputHint) inputHint.textContent = `最后输入：${dir.toUpperCase()}`;
        }

        // Swipe detection for touch devices
        (function setupSwipe(){
            let touchStart = null;
            canvas.addEventListener('touchstart', (e)=>{ if(e.touches && e.touches[0]){ touchStart = {x: e.touches[0].clientX, y: e.touches[0].clientY}; } }, {passive:true});
            canvas.addEventListener('touchend', (e)=>{
                if(!touchStart) return;
                const touch = (e.changedTouches && e.changedTouches[0]);
                if(!touch) return;
                const dx = touch.clientX - touchStart.x;
                const dy = touch.clientY - touchStart.y;
                const absx = Math.abs(dx), absy = Math.abs(dy);
                if(Math.max(absx,absy) < 20) return; // small movement -> ignore
                if(absx > absy){
                    if(dx>0 && direction !== 'left') nextDirection='right';
                    else if(dx<0 && direction !== 'right') nextDirection='left';
                } else {
                    if(dy>0 && direction !== 'up') nextDirection='down';
                    else if(dy<0 && direction !== 'down') nextDirection='up';
                }
                // update input hint on swipe
                if(inputHint){
                    const swipeDir = Math.abs(dx) > Math.abs(dy) ? (dx>0?'→':'←') : (dy>0?'↓':'↑');
                    inputHint.textContent = `最后输入：${swipeDir} (滑动)`;
                }
                touchStart = null;
            }, {passive:true});
        })();

        // ensure canvas is focused on load so arrow keys respond immediately
        window.addEventListener('load', ()=>{
            try{ canvas.focus(); }catch(e){}
        });

        // 初始化绘制
        draw();

        // Expose some functions to window for button onclick attributes
        window.startGame = startGame;
        window.pauseGame = pauseGame;
        window.resetGame = ()=>{ resetGame(false); };
        window.setSpeed = setSpeed;
        window.closeModal = closeModal;

    })();
</script>
</body>
</html>
