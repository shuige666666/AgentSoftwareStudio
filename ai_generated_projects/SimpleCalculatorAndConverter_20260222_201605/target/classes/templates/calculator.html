<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>计算器</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
    <style>
        .calculator-container {
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        .result-box {
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            padding: 15px;
            margin-top: 20px;
            min-height: 50px;
        }
    </style>
</head>
<body>
    <div class="container calculator-container">
        <h2 class="text-center mb-4">计算器</h2>
        
        <form id="calcForm" th:action="@{/calculate}" method="post">
            <div class="row mb-3">
                <div class="col-md-5">
                    <label for="num1" class="form-label">第一个数字</label>
                    <input type="number" class="form-control" id="num1" name="num1" step="any" required th:value="${num1}">
                </div>
                
                <div class="col-md-2 d-flex align-items-end">
                    <select class="form-select" id="operation" name="operation" required>
                        <option value="add" th:selected="${operation == 'add'}">+</option>
                        <option value="subtract" th:selected="${operation == 'subtract'}">-</option>
                        <option value="multiply" th:selected="${operation == 'multiply'}">×</option>
                        <option value="divide" th:selected="${operation == 'divide'}">÷</option>
                        <option value="power" th:selected="${operation == 'power'}">x^y</option>
                    </select>
                </div>
                
                <div class="col-md-5">
                    <label for="num2" class="form-label">第二个数字</label>
                    <input type="number" class="form-control" id="num2" name="num2" step="any" required th:value="${num2}">
                </div>
            </div>
            
            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-primary btn-lg">计算</button>
            </div>
        </form>
        
        <div class="result-box mt-4" th:if="${result != null and result != ''}">
            <h5>计算结果:</h5>
            <p id="result" th:text="${result}"></p>
        </div>
        <div class="alert alert-danger mt-4" th:if="${error != null and error != ''}">
            <p th:text="${error}"></p>
        </div>
        
        <div class="mt-4 text-center">
            <a href="/" class="btn btn-secondary">返回首页</a>
            <a href="/converter" class="btn btn-outline-primary">单位转换器</a>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/script.js"></script>
</body>
</html>
